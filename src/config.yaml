letters:
  pool: [F, H, J, K, L, N, P, C, R, S, T, G]

timing:
  equation_max: 10.0   # maks. czas na równanie (s)
  letter_max:    5.0   # maks. czas wyświetlania litery (s)
  blank_min:     0.200 # min. pusty ekran między bodźcami (s)
  blank_max:     1.000 # maks. pusty ekran między bodźcami (s)
  break_max:    30.0   # maks. czas przerwy między próbami (s)

scoring:
  math_threshold: 85   # wymagany % poprawności matematycznej

data:
  dir: data

display:
  fullscreen:   true   # ustaw false podczas testowania
  background:   'black'
  text_color:   'white'
  text_height:   0.08
  btn_color:    '#2a2a6a'  # normalny kolor przycisku
  btn_hover:    '#5555cc'  # kolor po najechaniu kursorem
  btn_selected: '#444488'  # kolor wybranego przycisku w recall

